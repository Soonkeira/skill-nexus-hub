name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app || true
      - name: Test
        run: python -m pytest -q

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test (node --test)
        run: node --test tests/*.test.mjs
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  cli:
    name: CLI (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install typer httpx rich pyyaml pytest
      - name: Test
        run: python -m pytest -q

  codegen-sync:
    name: Type drift check (openapi-typescript)
    runs-on: ubuntu-latest
    # Only warn for now — the generated api-types.ts is informational and not
    # yet wired into components, so drift is non-blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check api-types.ts is committed
        run: |
          test -f frontend/src/lib/api-types.ts && echo "api-types.ts present" || echo "api-types.ts not generated yet (run: cd frontend && npm run gen:types)"
